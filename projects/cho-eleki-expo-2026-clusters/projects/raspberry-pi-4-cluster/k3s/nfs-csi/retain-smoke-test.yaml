apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retain-probe
  namespace: nfs-csi-smoke
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-rwx-retain
  resources:
    requests:
      storage: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: retain-probe
  namespace: nfs-csi-smoke
spec:
  nodeName: node10
  restartPolicy: Never
  securityContext:
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: writer
      image: docker.io/rancher/mirrored-library-busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - printf 'retain-probe\n' > /data/sentinel.txt && sleep 3600
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: retain-probe
