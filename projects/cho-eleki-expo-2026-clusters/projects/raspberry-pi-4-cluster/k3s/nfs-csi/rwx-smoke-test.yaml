apiVersion: v1
kind: Namespace
metadata:
  name: nfs-csi-smoke
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data
  namespace: nfs-csi-smoke
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-rwx-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rwx-writer
  namespace: nfs-csi-smoke
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rwx-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rwx-writer
    spec:
      nodeSelector:
        exhibition.asamomiji.jp/nfs-csi-smoke: enabled
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: docker.io/rancher/mirrored-library-busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |-
              set -eu
              mkdir -p /data/nodes
              while true; do
                tmp="/data/nodes/${NODE_NAME}.tmp"
                printf '%s %s\n' "${NODE_NAME}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${tmp}"
                mv "${tmp}" "/data/nodes/${NODE_NAME}.txt"
                sleep 5
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: shared-data
              mountPath: /data
      terminationGracePeriodSeconds: 5
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
