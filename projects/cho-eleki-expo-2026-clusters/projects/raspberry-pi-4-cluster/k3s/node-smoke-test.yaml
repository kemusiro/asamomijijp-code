apiVersion: v1
kind: Namespace
metadata:
  name: cluster-smoke
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-smoke
  namespace: cluster-smoke
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-smoke
    spec:
      nodeSelector:
        exhibition.asamomiji.jp/role: compute
      containers:
        - name: server
          image: docker.io/rancher/mirrored-library-busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /www && hostname > /www/index.html && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: www
              mountPath: /www
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 5
      volumes:
        - name: www
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: node-smoke
  namespace: cluster-smoke
spec:
  selector:
    app.kubernetes.io/name: node-smoke
  ports:
    - name: http
      port: 8080
      targetPort: http
